# Local services for development. Start with `docker compose up -d`.
# Redis: presence, join codes and matchmaking for the realtime server (REDIS_URL=redis://localhost:6379).
# Postgres: the database arrives in Phase 4 (DATABASE_URL=postgresql://teckin:teckin-local@localhost:5432/teckin).
# Both bind to localhost only and use throwaway local passwords; never reuse them anywhere.
services:
  redis:
    image: redis:7-alpine
    ports:
      - '127.0.0.1:6379:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    ports:
      - '127.0.0.1:5432:5432'
    environment:
      POSTGRES_USER: teckin
      POSTGRES_PASSWORD: teckin-local
      POSTGRES_DB: teckin
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teckin']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
