# Deploys the web app to Azure: Bicep for the infrastructure, then the Next.js standalone
# package to App Service and the game assets to Blob Storage. Needs "Deploy platform" and
# "Deploy realtime" first. Manual trigger only; nothing runs on push. Before the first run,
# follow docs/DEPLOY.md.
name: Deploy web

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, prod]
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      realtime_url:
        description: Realtime entry URL (from Deploy realtime); defaults to the REALTIME_URL variable
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    name: Deploy web (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A GitHub environment per target lets Bryan add required reviewers before prod deploys.
    environment: ${{ inputs.environment }}
    steps:
      - name: Check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy from main only (this run is on ${{ github.ref }})."
          exit 1

      - name: Check configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          DEPLOY_PRINCIPAL_ID: ${{ vars.AZURE_DEPLOY_PRINCIPAL_ID }}
        run: |
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION_ID RESOURCE_GROUP DEPLOY_PRINCIPAL_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable AZURE_${name} is not set for this environment. See docs/DEPLOY.md."
              exit 1
            fi
          done

      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Hoisted node_modules so the standalone server has plain folders, not pnpm symlinks.
      - run: pnpm install --frozen-lockfile --config.node-linker=hoisted
      # Never ship what CI would reject.
      - run: pnpm check
      - run: pnpm build
        env:
          NEXT_OUTPUT: standalone
          NEXT_PUBLIC_CLIMBER_THEME: ${{ vars.CLIMBER_THEME || 'cogspire' }}
          # The realtime entry address printed by "Deploy realtime"; empty means the page's host.
          NEXT_PUBLIC_REALTIME_URL: ${{ inputs.realtime_url || vars.REALTIME_URL }}
      - run: pnpm --filter web assemble:deploy

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infra
        env:
          REALTIME_URL: ${{ inputs.realtime_url || vars.REALTIME_URL }}
          # Only whether it is set: the value itself lives in Key Vault (Deploy platform).
          EMAIL_CONFIGURED: ${{ secrets.EMAIL_SERVER != '' }}
        run: |
          if [ -z "$REALTIME_URL" ]; then
            echo "::error::REALTIME_URL is not set. Run Deploy realtime first and save its entry URL (docs/DEPLOY.md)."
            exit 1
          fi
          outputs=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "web-${{ github.run_id }}" \
            --template-file infra/web/main.bicep \
            --parameters "infra/web/main.${{ inputs.environment }}.bicepparam" \
            --parameters deployPrincipalId="${{ vars.AZURE_DEPLOY_PRINCIPAL_ID }}" \
                         realtimeUrl="$REALTIME_URL" \
                         publicSiteUrl="${{ vars.PUBLIC_SITE_URL }}" \
                         emailFrom="${{ vars.EMAIL_FROM }}" \
                         emailConfigured="$EMAIL_CONFIGURED" \
                         googleClientId="${{ vars.AUTH_GOOGLE_ID }}" \
                         microsoftClientId="${{ vars.AUTH_MICROSOFT_ENTRA_ID_ID }}" \
                         microsoftIssuer="${{ vars.AUTH_MICROSOFT_ENTRA_ID_ISSUER }}" \
            --query properties.outputs --output json)
          echo "web_app=$(echo "$outputs" | jq -r .webAppName.value)" >> "$GITHUB_OUTPUT"
          echo "storage=$(echo "$outputs" | jq -r .assetsStorageAccountName.value)" >> "$GITHUB_OUTPUT"
          echo "site_url=$(echo "$outputs" | jq -r .siteUrl.value)" >> "$GITHUB_OUTPUT"
          echo "Hosts sign in at: $(echo "$outputs" | jq -r .publicSiteUrl.value)"

      - name: Upload game assets
        # A new role assignment can take a few minutes to apply, so retry on the first deploy.
        run: |
          for attempt in $(seq 1 10); do
            if az storage blob upload-batch \
              --account-name "${{ steps.infra.outputs.storage }}" \
              --auth-mode login \
              --destination game-assets \
              --source apps/web/public/game-assets \
              --overwrite \
              --content-cache-control "public, max-age=86400"; then
              exit 0
            fi
            echo "Upload failed (attempt $attempt); waiting for the blob role to apply"
            sleep 30
          done
          exit 1

      - name: Deploy web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.infra.outputs.web_app }}
          package: apps/web/.deploy

      - name: Check health through Front Door
        run: |
          url="${{ steps.infra.outputs.site_url }}/api/health"
          for attempt in $(seq 1 20); do
            if curl --fail --silent "$url"; then echo; echo "Healthy: $url"; exit 0; fi
            sleep 15
          done
          echo "::error::$url did not report healthy within 5 minutes"
          exit 1
