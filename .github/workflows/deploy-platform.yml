# Deploys the shared platform to Azure (Key Vault with the apps' secrets, PostgreSQL Flexible
# Server, Communication Services Email), then applies database migrations. Run it first, and
# again whenever a release adds a migration (packages/db/prisma/migrations). Manual trigger
# only; nothing runs on push. Before the first run, follow docs/DEPLOY.md.
name: Deploy platform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, prod]
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-platform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    name: Deploy platform (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    steps:
      - name: Check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Deploy from main only (this run is on ${{ github.ref }})."
          exit 1

      - name: Check configuration
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          REALTIME_SHARED_SECRET: ${{ secrets.REALTIME_SHARED_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          for name in CLIENT_ID TENANT_ID SUBSCRIPTION_ID RESOURCE_GROUP; do
            if [ -z "${!name}" ]; then
              echo "::error::Environment variable AZURE_${name} is not set for this environment. See docs/DEPLOY.md."
              exit 1
            fi
          done
          for name in POSTGRES_ADMIN_PASSWORD REALTIME_SHARED_SECRET AUTH_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Environment secret ${name} is not set for this environment. See docs/DEPLOY.md."
              exit 1
            fi
          done
          if [ ${#REALTIME_SHARED_SECRET} -lt 32 ] || [ ${#AUTH_SECRET} -lt 32 ]; then
            echo "::error::REALTIME_SHARED_SECRET and AUTH_SECRET need at least 32 characters."
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infra
        # The .bicepparam files read the secrets from these variables, so they never appear on
        # a command line.
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          REALTIME_SHARED_SECRET: ${{ secrets.REALTIME_SHARED_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          EMAIL_SERVER: ${{ secrets.EMAIL_SERVER }}
          AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_MICROSOFT_ENTRA_ID_SECRET: ${{ secrets.AUTH_MICROSOFT_ENTRA_ID_SECRET }}
        run: |
          outputs=$(az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "platform-${{ github.run_id }}" \
            --template-file infra/platform/main.bicep \
            --parameters "infra/platform/main.${{ inputs.environment }}.bicepparam" \
            --query properties.outputs --output json)
          echo "postgres_server=$(echo "$outputs" | jq -r .postgresServerName.value)" >> "$GITHUB_OUTPUT"
          echo "postgres_host=$(echo "$outputs" | jq -r .postgresHostName.value)" >> "$GITHUB_OUTPUT"
          echo "database=$(echo "$outputs" | jq -r .databaseName.value)" >> "$GITHUB_OUTPUT"
          echo "admin=$(echo "$outputs" | jq -r .postgresAdministratorLogin.value)" >> "$GITHUB_OUTPUT"
          echo "Communication Services: $(echo "$outputs" | jq -r .communicationServiceName.value)"
          echo "Sign-in email sender: $(echo "$outputs" | jq -r .emailSenderAddress.value)"

      # The server accepts Azure services only; let this runner in just for the migrations.
      - name: Open the database to this runner
        id: firewall
        run: |
          runner_ip=$(curl --fail --silent https://api.ipify.org)
          rule="github-runner-${{ github.run_id }}"
          az postgres flexible-server firewall-rule create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infra.outputs.postgres_server }}" \
            --rule-name "$rule" \
            --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" \
            --output none
          echo "rule=$rule" >> "$GITHUB_OUTPUT"

      - name: Apply database migrations
        working-directory: packages/db
        env:
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          password=$(jq -rn --arg value "$POSTGRES_ADMIN_PASSWORD" '$value|@uri')
          echo "::add-mask::$password"
          export DATABASE_URL="postgresql://${{ steps.infra.outputs.admin }}:${password}@${{ steps.infra.outputs.postgres_host }}:5432/${{ steps.infra.outputs.database }}?sslmode=require"
          pnpm db:migrate
          pnpm db:status

      - name: Close the database to this runner
        if: always() && steps.firewall.outputs.rule != ''
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ steps.infra.outputs.postgres_server }}" \
            --rule-name "${{ steps.firewall.outputs.rule }}" \
            --yes --output none
