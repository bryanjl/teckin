name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Lets the realtime tests check join codes on Redis presence, as several processes use it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          REDIS_URL: redis://localhost:6379
      - run: pnpm build
      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  realtime-image:
    name: Build realtime image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Builds the image the realtime deploy ships (never pushed) and checks it starts.
      - run: docker build --file apps/realtime/Dockerfile --tag teckin-realtime:ci .
      - name: Smoke test
        run: |
          docker run --detach --name realtime --publish 2567:2567 teckin-realtime:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:2567/health; then exit 0; fi
            sleep 1
          done
          docker logs realtime
          exit 1

  infra:
    name: Validate Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Compiles and lints the templates offline; nothing signs in to Azure.
      - run: az bicep install
      - run: |
          for template in infra/*/main.bicep; do az bicep build --file "$template" --stdout > /dev/null; done
          for params in infra/*/*.bicepparam; do az bicep build-params --file "$params" --stdout > /dev/null; done
