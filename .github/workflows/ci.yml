name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Lets the realtime tests check join codes on Redis presence, as several processes use it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      # Database tests each make their own schema here; migrations are checked against it too.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teckin
          POSTGRES_PASSWORD: teckin-ci
          POSTGRES_DB: teckin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teckin" --health-interval 5s --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations and check they match the schema
        working-directory: packages/db
        env:
          DATABASE_URL: postgresql://teckin:teckin-ci@localhost:5432/teckin
        run: |
          pnpm db:migrate
          pnpm db:check-drift
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql://teckin:teckin-ci@localhost:5432/teckin
      - run: pnpm build
      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://teckin:teckin-ci@localhost:5432/teckin
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  realtime-image:
    name: Build realtime image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Builds the image the realtime deploy ships (never pushed) and checks it starts.
      - run: docker build --file apps/realtime/Dockerfile --tag teckin-realtime:ci .
      - name: Smoke test
        run: |
          docker run --detach --name realtime --publish 2567:2567 teckin-realtime:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:2567/health; then exit 0; fi
            sleep 1
          done
          docker logs realtime
          exit 1

  infra:
    name: Validate Bicep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Compiles and lints the templates offline; nothing signs in to Azure.
      - run: az bicep install
      - run: |
          for template in infra/*/main.bicep; do az bicep build --file "$template" --stdout > /dev/null; done
          for params in infra/*/*.bicepparam; do az bicep build-params --file "$params" --stdout > /dev/null; done

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Every commit, with the false positives listed in .gitleaks.toml. Fails the build.
      - name: Secret scan (gitleaks)
        run: |
          curl --fail --silent --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
            | tar --extract --gzip gitleaks
          ./gitleaks git --redact --no-banner .
      - uses: pnpm/action-setup@v4
      # Reports known advisories in production dependencies. It does not fail the build: some
      # advisories have no fixed version yet; Dependabot (.github/dependabot.yml) proposes the
      # fixes that exist.
      - name: Dependency audit
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high
